version: 2

models:
  - name: dim_users
    description: "One row per user with aggregated user-level metrics."

    columns:
      - name: user_pseudo_id
        description: "Unique GA4 user identifier."
        data_tests:
          - not_null
          - unique

      - name: first_seen_at
        description: "Timestamp of the user's first recorded event."
        data_tests:
          - not_null

      - name: last_seen_at
        description: "Timestamp of the user's most recent recorded event."
        data_tests:
          - not_null


  - name: stg_ga4_events
    description: "Cleaned GA4 event-level staging model."

    columns:
      - name: event_timestamp
        description: "Timestamp when the GA4 event occurred."
        data_tests:
          - not_null

      - name: event_name
        description: "Name of the GA4 event."
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: "GA4 pseudonymous user identifier."
        data_tests:
          - not_null

  - name: fct_sessions
    description: "One row per user session."

    columns:
      - name: session_id
        description: "Unique identifier created from user_pseudo_id and ga_session_id."
        data_tests:
          - not_null
          - unique

      - name: user_pseudo_id
        description: "GA4 pseudonymous user identifier."
        data_tests:
          - not_null

      - name: ga_session_id
        description: "GA4 session identifier."
        data_tests:
          - not_null

      - name: session_start_at
        description: "Timestamp of the first event in the session."
        data_tests:
          - not_null

      - name: session_end_at
        description: "Timestamp of the last event in the session."
        data_tests:
          - not_null

  - name: dim_products
    description: "One row per product identified by item_id."

    columns:
      - name: item_id
        description: "Unique product identifier from GA4."
        data_tests:
          - not_null
          - unique

  - name: fct_marketing_sessions
    description: "One row per user session with first-user acquisition information."
    columns:
      - name: session_id
        description: "Unique identifier created from user_pseudo_id and ga_session_id."
        data_tests:
          - not_null
          - unique

      - name: user_pseudo_id
        description: "GA4 pseudonymous user identifier."
        data_tests:
          - not_null

      - name: ga_session_id
        description: "GA4 session identifier."
        data_tests:
          - not_null

      - name: session_start_at
        description: "Timestamp of the first event in the session."
        data_tests:
          - not_null