version: 2

models:
  - name: dim_users
    description: "One row per user with aggregated user-level metrics."

    columns:
      - name: user_pseudo_id
        description: "Unique GA4 user identifier."
        data_tests:
          - not_null
          - unique

      - name: first_seen_at
        description: "Timestamp of the user's first recorded event."
        data_tests:
          - not_null

      - name: last_seen_at
        description: "Timestamp of the user's most recent recorded event."
        data_tests:
          - not_null


  - name: stg_ga4_events
    description: "Cleaned GA4 event-level staging model."

    columns:
      - name: event_timestamp
        description: "Timestamp when the GA4 event occurred."
        data_tests:
          - not_null

      - name: event_name
        description: "Name of the GA4 event."
        data_tests:
          - not_null

      - name: user_pseudo_id
        description: "GA4 pseudonymous user identifier."
        data_tests:
          - not_null

  - name: fct_sessions
    description: "One row per user session."

    columns:
      - name: session_id
        description: "Unique identifier created from user_pseudo_id and ga_session_id."
        data_tests:
          - not_null
          - unique

      - name: user_pseudo_id
        description: "GA4 pseudonymous user identifier."
        data_tests:
          - not_null

      - name: ga_session_id
        description: "GA4 session identifier."
        data_tests:
          - not_null

      - name: session_start_at
        description: "Timestamp of the first event in the session."
        data_tests:
          - not_null

      - name: session_end_at
        description: "Timestamp of the last event in the session."
        data_tests:
          - not_null

  - name: dim_products
    description: "One row per product identified by item_id."

    columns:
      - name: item_id
        description: "Unique product identifier from GA4."
        data_tests:
          - not_null
          - unique

  - name: fct_marketing_sessions
    description: "One row per user session with first-user acquisition information."
    columns:
      - name: session_id
        description: "Unique identifier created from user_pseudo_id and ga_session_id."
        data_tests:
          - not_null
          - unique

      - name: user_pseudo_id
        description: "GA4 pseudonymous user identifier."
        data_tests:
          - not_null

      - name: ga_session_id
        description: "GA4 session identifier."
        data_tests:
          - not_null

      - name: session_start_at
        description: "Timestamp of the first event in the session."
        data_tests:
          - not_null

  - name: mart_acquisition_performance
    description: "Marketing acquisition performance by first-user source, medium, and campaign."
    columns:
      - name: first_user_source
        description: "Source that originally acquired the user."

      - name: first_user_medium
        description: "Medium associated with the user's first acquisition."

      - name: first_user_campaign
        description: "Campaign associated with the user's first acquisition."

      - name: users
        description: "Number of distinct users."
        data_tests:
          - not_null

      - name: sessions
        description: "Number of distinct sessions."
        data_tests:
          - not_null

      - name: purchasing_sessions
        description: "Number of sessions containing a purchase."
        data_tests:
          - not_null

      - name: purchased_items
        description: "Number of purchased items."
        data_tests:
          - not_null

      - name: revenue
        description: "Total item revenue associated with the acquisition group."
        data_tests:
          - not_null

      - name: conversion_rate
        description: "Purchasing sessions divided by total sessions."
        data_tests:
          - not_null

      - name: revenue_per_user
        description: "Revenue divided by distinct users."
        data_tests:
          - not_null

      - name: revenue_per_session
        description: "Revenue divided by distinct sessions."
        data_tests:
          - not_null

  
  - name: mart_marketing_daily
    description: "Daily marketing performance. One row per session_date + source + medium, with funnel steps and revenue. Note: add_to_cart was not tracked 1-24 Nov 2020."
    columns:
      - name: session_date
        description: "Date the session started."
        data_tests:
          - not_null

      - name: source
        description: "First-user source. '(not set)' when missing."
        data_tests:
          - not_null

      - name: medium
        description: "First-user medium. '(not set)' when missing."
        data_tests:
          - not_null

      - name: sessions
        description: "Number of sessions."
        data_tests:
          - not_null

      - name: revenue
        description: "Item revenue from purchases in these sessions."
        data_tests:
          - not_null

  
  - name: mart_top_products
    description: "Product performance. One row per product with units sold, revenue and purchase sessions."
    columns:
      - name: item_id
        description: "Unique product identifier."
        data_tests:
          - not_null
          - unique

      - name: units_sold
        description: "Total quantity sold."
        data_tests:
          - not_null

      - name: revenue
        description: "Total item revenue for the product."
        data_tests:
          - not_null        